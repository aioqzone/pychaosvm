[project]
name = "pychaosvm"
version = "0.7.0.dev2"
description = "A Python envirionment for Tencent ChaosVM."
authors = [
    { name = "aioqzone", email = "22952836+JamzumSum@users.noreply.github.com" },
]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyjsparser>=2.7.1", "typing-extensions>=4.6.0", "lxml>=6.1.0"]

[dependency-groups]
test = ["pytest~=9.0.3"]
dev = ["ruff", "pre-commit", "types-lxml"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chaosvm"

# customize begin
[tool.pytest.ini_options]
pythonpath = 'src'

[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = [
    "F403", # 'from module import *' used; unable to detect undefined names
    "F405", # name may be undefined, or defined from star imports
]
