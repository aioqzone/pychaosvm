[project]
name = "pychaosvm"
version = "0.5.0"
description = "A Python envirionment for Tencent ChaosVM."
authors = [
    {name = "aioqzone", email = "22952836+JamzumSum@users.noreply.github.com"}
]
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyjsparser>=2.7.1",
    "typing-extensions>=4.6.0",
    "lxml>=6.0.2",
]

[dependency-groups]
test = [
    "pytest>=8.2.1",
]
dev = [
    "ruff",
    "pre-commit",
    "types-lxml>=2024.2.9",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chaosvm"

# customize begin
[tool.pytest.ini_options]
pythonpath = 'src'

[tool.ruff]
line-length = 99

[tool.pyright]
pythonVersion = "3.9"
pythonPlatform = "All"
